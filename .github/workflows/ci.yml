name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASES: https://github.com/godotengine/godot-builds/releases/download

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Godot aus Cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-editor-${{ env.GODOT_VERSION }}

      - name: Godot herunterladen
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$GODOT_RELEASES/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot

      - name: Projekt importieren
        run: ~/godot/godot --headless --import

      - name: Tests ausführen
        run: ~/godot/godot --headless -s addons/gut/gut_cmdln.gd -gexit

  android:
    name: Android-Test-APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot und Android-Vorlagen aus Cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-android-${{ env.GODOT_VERSION }}

      - name: Godot und Android-Vorlagen herunterladen
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$GODOT_RELEASES/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$GODOT_RELEASES/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz 'templates/android*' 'templates/version.txt' -d /tmp/tpl
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          mv /tmp/tpl/templates/* "$dest/"
          rm /tmp/templates.tpz

      - name: Godot für Android einrichten
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres

      - name: Projekt importieren
        run: ~/godot/godot --headless --import

      - name: APK bauen
        run: |
          mkdir -p build
          ~/godot/godot --headless --export-debug "Android" build/durnhal-debug.apk
          test -s build/durnhal-debug.apk
          ls -lh build

      - name: APK prüfen
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs build/durnhal-debug.apk | head -3
          "$bt/aapt2" dump badging build/durnhal-debug.apk | grep -E "^package|sdkVersion|native-code|application-label:"

      - uses: actions/upload-artifact@v4
        with:
          name: durnhal-debug-apk
          path: build/durnhal-debug.apk
          retention-days: 30
